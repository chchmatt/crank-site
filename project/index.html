<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Build status</title>
<style>
:root{--ground:#1c1b29;--surface:#25243a;--border:#3a3957;--text:#f4efe2;--muted:#a9a5bf;--accent:#ff5a36;--amber:#f5c05a;--green:#5fd39a;--chip:#2e2d46;--warm:#33211f;--warm-track:#5a3a36;
--card-h:144px;--merge-h:108px;--gutter:16px}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button:disabled{cursor:not-allowed}
.mono{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.wrap{max-width:1160px;margin:0 auto;padding:0 var(--gutter)}
[hidden]{display:none!important}

/* header */
header{border-bottom:1px solid var(--border);padding:16px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{flex:none;width:72px;height:72px;display:block}
/* job 21: the header logo is big and always still. The turning is done by the small crank on each runner card that is building (below), in CSS only. */
@keyframes crank-turn{to{transform:rotate(360deg)}}
.who{flex:1;min-width:180px}
@media (max-width:520px){.who{min-width:120px}}
.who h1{margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere;min-width:0;flex:1}
/* job 26: the toolbar on the project's name line, at the right: settings (a cog) and the account (a silhouette). 44 px targets, muted, the accent on hover or focus. */
.namerow{display:flex;align-items:center;gap:8px;min-width:0}
.tb{display:flex;flex:none;margin-left:auto}
.tb button{width:44px;height:44px;padding:0;display:grid;place-items:center;background:transparent;border:0;border-radius:10px;color:#a9a5bf}
.tb button:hover,.tb button:focus-visible{color:var(--accent)}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#acctnote{font-size:12px;color:var(--muted)}
#acctnote:empty{display:none}
/* job 38: the gripper, the pinned rows, a row that is being dragged or moved, and the toast. The gripper and the arrows draw their marks with CSS, so the cell's own text stays the job number and the note. */
.grip,.cgrip,.mvb{border:0;background:transparent;color:var(--muted);padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grip{width:28px;min-height:44px;margin-right:4px;font-size:16px;line-height:1}
.grip::before{content:"\22EE\22EE"}
.grip[hidden],.mvb[hidden],.cgrip[hidden],.mv[hidden]{display:none!important}
.grip:hover,.grip:focus-visible,.cgrip:hover,.mvb:hover,.mvb:focus-visible{color:var(--accent)}
td.num{white-space:nowrap}
.mv{display:inline-flex;gap:2px;margin-left:8px;vertical-align:middle}
.mvb{width:44px;height:44px;min-height:44px;font-size:14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;touch-action:manipulation}
.mvb.up::before{content:"\25B2"}
.mvb.dn::before{content:"\25BC"}
.mvb:disabled{opacity:.4;cursor:not-allowed}
.cgrip{display:inline-block;width:18px;height:18px;margin-left:4px;font-size:12px;line-height:18px;text-align:center}
.cgrip::before{content:"\22EE\22EE"}
tr.pin-owner td{background:var(--warm)}
tr.pin-owner td.state span,tr.pin-owner td.state{font-weight:700}
tr.pin-owner td.num{box-shadow:inset 3px 0 0 var(--amber)}
tr.pin-building td.num{box-shadow:inset 3px 0 0 var(--accent)}
tr.dragging td{opacity:.55}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--accent)}
tr.moving td{opacity:.7}
.chip.dragging{opacity:.55}
.chip.drop-here{outline:2px solid var(--accent)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,520px);padding:10px 14px;background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:10px;font-size:14px;z-index:5}
#toast:empty{display:none}
/* the project settings view (job 27): the project's name, the most runners (− and +) and the job prefix (a field and Save) */
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border)}
.srow .sl{flex:none;min-width:96px;font-size:13px;font-weight:600}
.srow .sv{font-size:14px;overflow-wrap:anywhere}
.srow .sn{min-width:32px;text-align:center;font-size:18px;font-weight:600}
.srow button{min-height:44px;min-width:44px;padding:0 14px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:16px}
.srow button:disabled{color:var(--muted);border-style:dashed}
.srow button.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);font-weight:600;font-size:14px}
.srow input{box-sizing:border-box;width:84px;min-height:44px;padding:0 10px;font:inherit;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:10px}
.sm{flex-basis:100%;font-size:13px;color:var(--amber)}
.sm:empty{display:none}
.sh{flex-basis:100%;font-size:13px;color:var(--muted)}
.sh:empty{display:none}
#settings{margin-top:12px}
#settings h2{margin:8px 0;font-size:17px;font-weight:600}
#back{min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
.ctl{font-size:13px;color:var(--muted)}
.ctl .dot{display:inline-block;width:1.1em}
.ctl.ok .dot{color:var(--green)}
.ctl.warn .dot{color:var(--amber)}
#msg{min-height:18px;font-size:13px;color:var(--amber)}
#hold{flex:none;min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
#hold[aria-pressed="true"]{background:var(--warm);border-color:var(--accent)}
#hold:disabled{color:var(--muted);border-style:dashed}
/* job 20: a command that was sent shows it at once: a "sent" look (colour AND words), a small turning mark, and the button cannot be pressed again until the controller answers */
#hold.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);border-style:solid;font-weight:600}
#hold .busy,.question .busy,.srow .busy{display:inline-block;margin-right:6px;animation:crank-turn 1s linear infinite}
@media (prefers-reduced-motion:reduce){#hold .busy,.question .busy,.srow .busy{animation:none}}
/* job 59: a question a runner asked the operator: a box at the top with the job, the line, then Approve / Reject, a text box and Send, or the command and Done */
#questions{margin-top:12px}
.question{border:1px solid var(--amber);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--surface)}
.question .qh{font-size:13px;font-weight:600;color:var(--amber)}
.question .ql{margin-top:4px;font-size:14px;overflow-wrap:anywhere}
.question .qc{display:block;margin-top:6px;padding:6px 8px;font-family:monospace;font-size:13px;background:var(--warm);border-radius:6px;overflow-wrap:anywhere;user-select:all}
.question textarea{box-sizing:border-box;width:100%;min-height:44px;margin-top:8px;padding:8px;font:inherit;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px}
.question .qb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.question button{min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
.question button:disabled{color:var(--muted);border-style:dashed}
.question button.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);font-weight:600}
.question .qm{margin-top:6px;font-size:13px;color:var(--amber)}
#holdwhy{font-size:12px;color:var(--muted)}
#holdwhy:empty{display:none}

/* runners */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 0 8px}
.sec h2{margin:0;font-size:15px;font-weight:600}
.sec span{font-size:13px;color:var(--muted)}
#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* ONE size for every card, whatever its state: no state class below changes height, padding or width, so nothing jumps */
.card{position:relative;height:var(--card-h);padding:12px;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.card .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .jb{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.3;min-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .tt{font-size:13px;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track{margin-top:auto;height:6px;flex:none}
.bar{height:6px;width:0}
.card.building{border-color:var(--accent)}
.card.building .st{color:var(--accent)}
.card.building .track{border-radius:3px;background:var(--border)}
.card.building .bar{border-radius:3px;background:var(--accent)}
.card.owner{border-color:var(--amber)}
.card.owner .st{color:var(--amber)}
.card.waiting{background:transparent;border:1px dashed var(--muted)}
.card.waiting .st{color:var(--muted)}
.card.paused{background:transparent}
.card.paused .st{color:var(--muted)}
.card.paused .nm,.card.paused .tt{color:var(--muted)}
.card.merge{grid-column:1/-1;height:var(--merge-h);background:transparent;border:1px dashed var(--border)}
.card.merge .st{font-weight:500;color:var(--muted)}
.card.merge .tt{min-height:0;margin-top:4px;-webkit-line-clamp:2;color:var(--muted)}
.card.merge.merging{background:var(--warm);border:1px solid var(--accent)}
.card.merge.merging .st{color:var(--accent);font-weight:600}
.card.merge.merging .tt{color:var(--text)}
.card.merge.merging .track{border-radius:3px;background:var(--warm-track)}
/* job 21: the small crank on a card: the approved icon's tile, ring and arm (the arm is its own layer, so it turns about the ring's centre). It turns steadily while the card is building (the page puts .turn on it only while the data is under 2 minutes old), after a crank start (.start: one or two slow heavy turns with a shake, about 1.5 s, then the steady turn goes on without a jump). CSS animations only. */
.card .nm{padding-right:34px}
.card .cm{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:7px;background:#1c1b29;pointer-events:none}
.card .cm .ring,.card .cm .arm{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:50% 50%}
.card .cm .ring{left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border:1.8px solid #f4efe2;border-right-color:transparent;border-radius:50%;box-sizing:border-box}
.card .cm .ring::after{content:"";position:absolute;left:50%;top:50%;width:3.5px;height:3.5px;margin:-1.75px 0 0 -1.75px;border-radius:50%;background:#ff5a36}
.card .cm .arm::before{content:"";position:absolute;left:50%;top:50%;width:7.3px;height:1.5px;margin-top:-.75px;border-radius:1px;background:#ff5a36}
.card .cm .arm::after{content:"";position:absolute;left:calc(50% + 5.15px);top:calc(50% - 2.15px);width:4.3px;height:4.3px;border-radius:50%;background:radial-gradient(#1c1b29 0 .8px,#ff5a36 .9px)}
.card.turn .cm .arm{animation:crank-turn 4s linear infinite}
.card.turn.start .cm{animation:crank-shake 1.5s linear 1}
.card.turn.start .cm .arm{animation:crank-start 1.5s linear 1,crank-turn 4s linear 1.5s infinite}
@keyframes crank-start{0%{transform:rotate(0)}22%{transform:rotate(70deg);animation-timing-function:ease-out}30%{transform:rotate(40deg);animation-timing-function:ease-in}62%{transform:rotate(400deg)}100%{transform:rotate(720deg)}}
@keyframes crank-shake{0%,100%{transform:translate(0,0) rotate(0)}8%{transform:translate(-1.5px,1px) rotate(-3deg)}16%{transform:translate(1.5px,-1px) rotate(3deg)}24%{transform:translate(-1px,-1.5px) rotate(-2deg)}32%{transform:translate(1px,1.5px) rotate(2deg)}44%{transform:translate(-1.5px,0) rotate(-3deg)}56%{transform:translate(1px,-1px) rotate(2deg)}70%{transform:translate(-.5px,.5px) rotate(-1deg)}85%{transform:translate(.5px,-.5px) rotate(1deg)}}
@media (prefers-reduced-motion:reduce){.card .cm,.card .cm .arm{animation:none!important}}
/* merging has no percent, so the bar is a slow diagonal stripe (it moves a little over 3 s); idle and held show no bar at all. With reduced motion the stripe stays, and does not move. */
.card.merge.merging .bar{border-radius:3px;width:100%;background:repeating-linear-gradient(135deg,var(--accent) 0 8px,transparent 8px 16px);background-size:22.63px 22.63px;animation:merge-stripe 3s linear infinite}
@keyframes merge-stripe{to{background-position:22.63px 0}}
@media (prefers-reduced-motion:reduce){.card.merge.merging .bar{animation:none}}
.card.merge.held{border:1px solid var(--amber);background:transparent}
.card.merge.held .st{color:var(--amber);font-weight:600}
.none{grid-column:1/-1;font-size:13px;color:var(--muted);padding:8px 0}
.none:empty{display:none}

/* the needs-the-operator strip: always this tall, whether or not anything is in it */
#strip{margin-top:10px;height:52px;border:1px solid var(--border);border-radius:10px;padding:0 12px;display:flex;gap:10px;align-items:center;color:var(--muted)}
#strip.on{border-color:var(--amber);color:var(--text)}
#strip svg{flex:none;stroke:currentColor}
#strip.on svg{stroke:var(--amber)}
#striptext{flex:1;min-width:0;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* tabs and chips */
nav.tabs{margin-top:18px;display:flex;flex-wrap:nowrap;overflow-x:auto;border-bottom:1px solid var(--border);gap:4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar,#chips::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:48px;padding:0 12px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:15px;font-weight:500}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.tab .n,.chip .n{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;margin-left:4px}
.tab[aria-selected="true"] .n{color:var(--accent)}
#statechips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:12px 0 0;scrollbar-width:none}
#statechips[hidden]{display:none}
.chip .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#d8322a;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.chip .badge[hidden]{display:none}
.pz{min-height:44px;min-width:44px;padding:0 14px;margin-left:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px}
.pz[hidden]{display:none}
.pz:disabled{opacity:.55}
#chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:12px 0;min-height:68px;scrollbar-width:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:transparent;color:var(--text)}
.chip .n{margin:0;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text)}
.chip[aria-pressed="true"] .n{background:var(--ground);color:var(--text)}
.chip .sym{font-size:12px}
.chip .sym.building{color:var(--accent)}.chip .sym.owner{color:var(--amber)}.chip .sym.waiting,.chip .sym.paused{color:var(--muted)}
.chip[aria-pressed="true"] .sym{color:#4a4763}
.chip[aria-pressed="true"] .sym.building{color:#c2381a}.chip[aria-pressed="true"] .sym.owner{color:#8a5a00}

/* job rows: a list on a phone, a table on a desktop (one table, laid out two ways) */
table{width:100%;border-collapse:collapse}
thead{display:none}
tbody,tr,td{display:block}
tr{display:flex;flex-wrap:wrap;align-items:baseline;padding:12px 0;border-top:1px solid var(--border);column-gap:0}
td{padding:0}
td.num{flex:0 0 3.8em;font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;color:var(--muted)}
td.title{flex:0 0 calc(100% - 3.8em);font-weight:500;overflow-wrap:anywhere}
td.state,td.topic,td.note{flex:0 0 auto;margin:6px 10px 0 0;font-size:13px;color:var(--muted)}
td.state{padding-left:0}
td.topic:empty,td.note:empty{display:none}
.s-building{color:var(--accent);font-weight:600}.s-owner{color:var(--amber);font-weight:600}.s-failed{color:var(--amber);font-weight:600}
.empty{padding:28px 0;font-size:14px;color:var(--muted)}
.more{min-height:44px;margin:12px 0;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:14px}
.foot{margin:20px 0 28px;font-size:12px;color:var(--muted)}
#failed{margin:12px 0 0;font-size:13px;color:var(--amber)}
#failed:empty{display:none}

@media (min-width:760px){
  :root{--card-h:156px;--merge-h:156px;--gutter:24px}
  header .wrap{gap:14px}
  .mark{width:80px;height:80px}
  .who h1{font-size:18px}
  #cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .card{padding:14px}
  .card .nm,.card .st{font-size:14px}
  .card .jb{margin-top:8px;font-size:13px}
  .card .tt{font-size:14px;min-height:36px}
  .card.merge{grid-column:auto}
  .card.merge .tt{margin-top:8px;-webkit-line-clamp:2}
  #strip{margin-top:12px}
  nav.tabs{margin-top:28px;flex-wrap:wrap;gap:6px}
  .tab{padding:0 16px}
  #chips{flex-wrap:wrap;overflow:visible;min-height:0;padding:16px 0}
  .chip{padding:0 16px}
  .tablewrap{overflow-x:auto}
  table{display:table;font-size:14px}
  thead{display:table-header-group}
  tbody{display:table-row-group}
  tr{display:table-row;padding:0}
  td,th{display:table-cell}
  th{text-align:left;font-size:12px;color:var(--muted);letter-spacing:.04em;padding:8px 12px;font-weight:500;border-bottom:1px solid var(--border)}
  td{padding:12px;border-bottom:1px solid var(--border)}
  tr{border-top:0}
  td.num,td.title,td.state,td.topic,td.note{margin:0;flex:none}
  td.state{white-space:nowrap}
  td.topic:empty,td.note:empty{display:table-cell}
  tbody tr:hover td{background:var(--surface)}
}
</style>
</head>
<body>
<div id="page" hidden>
<header><div class="wrap">
<svg class="mark" id="mark" viewBox="0 0 200 200" role="img" aria-label="Crank"><rect width="200" height="200" rx="46" fill="#1c1b29"/><g transform="translate(10.00,10.00) scale(0.9)"><path d="M139.8 66.6 A52 52 0 1 0 139.8 133.4" fill="none" stroke="#f4efe2" stroke-width="14" stroke-linecap="round"/><g class="arm"><line x1="100" y1="100" x2="158.00" y2="100.00" stroke="#ff5a36" stroke-width="12" stroke-linecap="round"/><circle cx="158.00" cy="100.00" r="17" fill="#ff5a36"/><circle cx="158.00" cy="100.00" r="6" fill="#1c1b29"/></g><circle cx="100" cy="100" r="14" fill="#ff5a36"/><circle cx="100" cy="100" r="5" fill="#1c1b29"/></g></svg>

<script>
(function () {
  'use strict';
  var STORE = 'https://crankbuildstore.blob.core.windows.net/build/'; // (the folder the data file is read from, put in when the page is made from the project's settings; '' when the project has none)
  var CHECK_EVERY = 10000;
  var CONTROLLER_QUIET_MS = 2 * 60 * 1000;
  var STALE_MS = 2 * 60 * 1000; // the crank in the header stops when the data is older than this
  var INBOX_KEY = 'crank-inbox';
  var TAB_KEY = 'crank-tab';
  var DONE_STEP = 20;
  var TABS = [['list', 'The list'], ['merges', 'Merge history'], ['backlog', 'Backlog'], ['june', 'June backlog']];
  // the words and the symbols of a state: a state is never told by colour alone
  var ST = {
    building: { sym: '▶', word: 'Building' },
    owner: { sym: '⚑', word: 'Needs operator' },
    waiting: { sym: '◔', word: 'Waiting for a runner' },
    paused: { sym: '❚❚', word: 'Paused' }
  };
  // job 18: how a merge run's result is told (a word and a symbol, never colour alone)
  var MERGE_RES = {
    'merged': { sym: '✓', word: 'Merged', cls: '' },
    'checks failed': { sym: '✗', word: 'Checks failed', cls: 's-owner' },
    'conflict': { sym: '✗', word: 'Conflict', cls: 's-owner' },
    'refused': { sym: '⚑', word: 'Refused', cls: 's-owner' },
    'stopped': { sym: '❚❚', word: 'Stopped', cls: '' }
  };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var ROW = {
    building: { sym: '▶', word: 'Building', cls: 's-building' },
    owner: { sym: '⚑', word: 'Needs operator', cls: 's-owner' },
    waiting: { sym: '◔', word: 'Waiting', cls: '' },
    queued: { sym: '○', word: 'Queued', cls: '' },
    paused: { sym: '❚❚', word: 'Paused', cls: '' },
    failed: { sym: '✕', word: 'Failed', cls: 's-failed' },
    blocked: { sym: '■', word: 'Blocked', cls: 's-failed' },
    done: { sym: '✓', word: 'Done', cls: '' },
    part: { sym: '✓', word: 'Done', cls: '' }, // (job 66: no more "Done in part"; an old progress file that still says part shows as Done)
    built: { sym: '◐', word: 'Built', cls: '' },
    merged: { sym: '✓', word: 'Merged', cls: '' },
    cancelled: { sym: '✕', word: 'Cancelled', cls: '' }
  };
  // job 99: the one state of a row in the words of the progress file's jobState, and the state chip it counts under (To do, Active, Done, Cancelled)
  var JOB_STATE = { waiting: 'waiting', queued: 'queued', paused: 'paused', building: 'building', 'needs-operator': 'owner', built: 'built', merged: 'merged', cancelled: 'cancelled' };
  var GROUP = { waiting: 'todo', queued: 'todo', paused: 'todo', building: 'active', owner: 'active', built: 'active', merged: 'done', cancelled: 'cancelled' };
  var GROUPS = [['todo', 'To do'], ['active', 'Active'], ['done', 'Done'], ['cancelled', 'Cancelled']];
  var GROUPS_KEY = 'crank-states';
  var BUILDING_LINE = "A job being built can't be paused. Stop ends the build.";
  var RUNNER_STOPPED = { 'closed-by-hand': 1, 'waiting-limit': 1, 'needs-you': 1, 'finished': 1, 'retry': 1 };
  var FINISHED = { done: 1, part: 1 };

  // ---------- reading the progress file into what the page shows (no DOM here) ----------
  function isOpen(i) { return i && !FINISHED[i.state]; }
  function clean(s) { return String(s == null ? '' : s); }
  function controllerOf(d) { return d && d.controller && typeof d.controller === 'object' ? d.controller : null; }
  function queueEntry(d, n) { return (d && Array.isArray(d.queue) ? d.queue : []).filter(function (q) { return q && q.number === n; })[0] || null; }
  function topicOfItem(d, i) { var q = queueEntry(d, i.number); return (q && q.topic) || i.topic || ''; }
  function nameWords(t) { return t.charAt(0).toUpperCase() + t.slice(1) + ' runner'; }
  function agoWords(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + ' s';
    var m = Math.round(s / 60);
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60);
    return h + ' h ' + (m % 60) + ' min';
  }
  function clockOf(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function taskPercent(r) {
    var tasks = Array.isArray(r.tasks) ? r.tasks : [];
    if (tasks.length) return Math.round(tasks.filter(function (t) { return t && t.state === 'done'; }).length / tasks.length * 100);
    return typeof r.percent === 'number' ? Math.max(0, Math.min(100, Math.round(r.percent))) : 0;
  }
  /** Who is building which job now: [{ topic, number, title, percent }] from the runners list, the old single `now`, or the jobs marked working. */
  function buildersOf(d) {
    var out = [];
    var stopped = {};
    if (d.fleet && Array.isArray(d.fleet.runners)) d.fleet.runners.forEach(function (r) { if (r && RUNNER_STOPPED[r.state]) stopped[r.id] = true; });
    var list = Array.isArray(d.runners) && d.runners.length ? d.runners : (d.state === 'working' && d.now ? [d.now] : []);
    list.forEach(function (r) {
      if (!r || !Number.isInteger(r.number) || (r.id && stopped[r.id])) return;
      if (d.vscode && r.number === d.vscode.number) return; // (the VS Code run has its own strip; the old `now` is a copy of it)
      var it = (d.items || []).filter(function (i) { return i && i.number === r.number; })[0];
      out.push({ topic: r.topic || (it ? topicOfItem(d, it) : ''), number: r.number, title: clean(r.title || (it && it.title)), percent: taskPercent(r) });
    });
    (d.items || []).forEach(function (i) {
      if (i && d.vscode && i.number === d.vscode.number) return; // (the VS Code run has its own strip)
      if (i && i.state === 'working' && !out.some(function (o) { return o.number === i.number; }) && !(i.runner && stopped[i.runner])) out.push({ topic: topicOfItem(d, i), number: i.number, title: clean(i.title), percent: 0 });
    });
    return out;
  }
  function unmetOf(i, openSet) { return (Array.isArray(i.after) ? i.after : []).filter(function (n) { return openSet[n]; }); }
  function topicPaused(d, name) {
    var t = (d.topics || []).filter(function (x) { return x && x.name === name; })[0];
    return !!(t && t.paused);
  }
  /** Job 19: the ONE list of what needs the operator. The controller works it out and uploads it (`ownerNeeds`); a file that has none (an older upload) gets the same list worked out here by the same rules (scripts/owner-needs.js). The cards, the strip and the count all read it. */
  function ownerListOf(d, open) {
    if (Array.isArray(d.ownerNeeds)) return d.ownerNeeds.filter(function (n) { return n && typeof n === 'object'; });
    var out = [];
    open.forEach(function (i) {
      if (i.state === 'needs-you' || i.attended === true || i.state === 'failed' || i.state === 'blocked') out.push({ kind: 'job', number: i.number, title: clean(i.title), topic: topicOfItem(d, i), why: clean(i.needs || '') });
    });
    (d.questions || []).forEach(function (q) {
      if (!q || !q.item) return;
      var have = out.filter(function (n) { return n.kind === 'job' && n.number === q.item; })[0];
      if (have) have.why = clean(q.say);
      else { var it0 = open.filter(function (i) { return i.number === q.item; })[0]; out.push({ kind: 'job', number: q.item, title: clean(q.title), topic: it0 ? topicOfItem(d, it0) : '', why: clean(q.say) }); }
    });
    var seen = {};
    var add = function (e) { var k = e.topic || e.title; if (seen[k]) return; seen[k] = true; out.push(e); };
    if (d.fleet && Array.isArray(d.fleet.runners)) d.fleet.runners.forEach(function (r) { if (r && r.state === 'needs-you') add({ kind: 'runner', topic: r.topic || '', title: 'Runner ' + (r.id || ''), why: clean(r.reason || 'the runner stopped') }); });
    (d.topics || []).forEach(function (t) { if (t && t.name && t.state === 'needs you') add({ kind: 'topic', topic: t.name, title: 'Topic ' + t.name, why: clean(t.why || 'the topic needs the operator') }); });
    return out;
  }
  /** The state of one row of the list. */
  /** Job 59: the open question of a job, or null. */
  function questionOf(d, number) { return (d && Array.isArray(d.questions) ? d.questions : []).filter(function (q) { return q && q.item === number; })[0] || null; }
  function rowState(d, i, openSet) {
    if (i.state === 'working') return 'building';
    if (questionOf(d, i.number)) return 'owner';
    var js = JOB_STATE[i.jobState];
    if (js) return (js === 'waiting' || js === 'queued') && topicPaused(d, topicOfItem(d, i)) ? 'paused' : js; // (job 99: a file from job 31 on says the one state itself)
    if (i.state === 'failed' || i.state === 'blocked') return 'owner';
    if (i.state === 'paused' || topicPaused(d, topicOfItem(d, i))) return 'paused';
    if (i.state === 'needs-you' || i.attended === true) return 'owner';
    return unmetOf(i, openSet).length ? 'waiting' : 'queued';
  }
  function rowNote(d, i, st, openSet) {
    if (st === 'paused') return i.state === 'paused' ? clean(i.reason || 'paused') : 'topic paused';
    if (st === 'owner') return clean((questionOf(d, i.number) || {}).say || i.needs || i.jobNote || (i.state === 'failed' || i.state === 'blocked' ? i.state + (i.reason ? ': ' + i.reason : '') : ''));
    if (st === 'building') return BUILDING_LINE;
    if (st === 'built') return clean(i.jobNote || (topicOfItem(d, i) ? 'waiting for topic ' + topicOfItem(d, i) + ' to reach main' : 'waiting for its topic to reach main'));
    if (i.jobNote) return clean(i.jobNote);
    var un = unmetOf(i, openSet);
    if (un.length) return 'after ' + un.join(', ');
    return clean(i.note || '');
  }

  /** Everything the page shows, worked out from one progress file. Pure: the same file gives the same answer. */
  function buildModel(d, nowMs) {
    var items = Array.isArray(d.items) ? d.items : [];
    var open = items.filter(isOpen);
    var openSet = {};
    open.forEach(function (i) { openSet[i.number] = true; });
    var c = controllerOf(d);
    var held = !!d.hold;
    var m = { held: held };

    // the controller line
    var seen = c && c.lastSeen ? new Date(c.lastSeen).getTime() : NaN;
    if (!c) m.controller = { sym: '○', word: 'No controller data yet', ok: false, live: false };
    else if (!isNaN(seen) && nowMs - seen > CONTROLLER_QUIET_MS) m.controller = { sym: '▲', word: 'Controller quiet since ' + clockOf(c.lastSeen), ok: false, live: false };
    else if (c.mode === 'live') m.controller = { sym: '●', word: 'Controller running', ok: true, live: true };
    else m.controller = { sym: '●', word: 'Controller watching (shadow)', ok: true, live: false };
    var stamp = Date.parse(d.watcherCheckedAt || '') > Date.parse(d.updatedAt || '') ? d.watcherCheckedAt : d.updatedAt;
    m.updatedAt = Date.parse(stamp || '');

    // one card for each topic that has open jobs, in the queue's own topic order (never sorted by state)
    var order = (d.topics || []).filter(function (t) { return t && t.name; }).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }).map(function (t) { return t.name; });
    var seenTopic = {};
    var byTopic = {};
    open.forEach(function (i) { var t = topicOfItem(d, i); if (!byTopic[t]) byTopic[t] = []; byTopic[t].push(i); });
    var extra = Object.keys(byTopic).filter(function (t) { return t && order.indexOf(t) < 0; }).sort();
    var topics = order.concat(extra).filter(function (t) { if (seenTopic[t]) return false; seenTopic[t] = true; return !!byTopic[t]; });
    var builders = buildersOf(d);
    var ownerList = ownerListOf(d, open);
    var needOther = {};
    ownerList.forEach(function (n) { if (n.kind !== 'job' && n.topic && !needOther[n.topic]) needOther[n.topic] = n; });
    m.cards = topics.map(function (t) {
      var its = byTopic[t];
      var tp = (d.topics || []).filter(function (x) { return x && x.name === t; })[0] || {};
      var b = builders.filter(function (x) { return x.topic === t; })[0];
      var runnable = its.filter(function (i) { return i.state === 'waiting' && i.attended !== true && !unmetOf(i, openSet).length && !topicPaused(d, t); })[0];
      var qHere = (d.questions || []).filter(function (q) { return q && its.some(function (i) { return i.number === q.item; }); })[0];
      var ownerJob = its.filter(function (i) { return i.state === 'needs-you' || i.attended === true || i.state === 'failed' || i.state === 'blocked'; })[0];
      var card = { key: t, name: nameWords(t), topic: t, state: 'waiting', num: '', title: '', detail: '', percent: 0 };
      var first = its[0];
      if (tp.paused) {
        card.state = 'paused';
        card.detail = b ? 'finishing job ' + b.number : 'topic paused';
      } else if (needOther[t]) {
        card.state = 'owner';
        first = ownerJob || first;
        card.detail = needOther[t].why ? 'needs the operator: ' + needOther[t].why : 'needs the operator';
      } else if (qHere) {
        card.state = 'owner';
        first = its.filter(function (i) { return i.number === qHere.item; })[0] || first;
        card.detail = 'needs the operator: ' + clean(qHere.say);
      } else if (b) {
        card.state = 'building';
        card.percent = b.percent;
        first = its.filter(function (i) { return i.number === b.number; })[0] || { number: b.number, title: b.title };
      } else if (its.every(function (i) { return i.state === 'paused'; })) {
        card.state = 'paused';
        card.detail = 'every open job is paused';
      } else if (runnable) {
        card.state = 'waiting';
        first = runnable;
        card.detail = 'ready, no runner on this topic';
      } else if (ownerJob) {
        card.state = 'owner';
        first = ownerJob;
        card.detail = ownerJob.state === 'failed' || ownerJob.state === 'blocked' ? 'is ' + ownerJob.state : 'needs the operator';
      } else {
        card.state = 'waiting';
        var u = unmetOf(first, openSet)[0];
        card.detail = u ? 'waiting on job ' + u : 'nothing is ready';
      }
      card.num = String(first.number);
      card.title = clean(first.title);
      return card;
    });

    // VS Code's own strip (job 15): only when a VS Code run has an entry; it shows that run's job and tasks, like a runner's card
    if (d.vscode && Number.isInteger(d.vscode.number)) {
      m.cards.push({ key: 'vscode', name: 'VS Code', topic: '', state: 'building', num: String(d.vscode.number), title: clean(d.vscode.title), detail: clean(d.vscode.doing || ''), percent: taskPercent(d.vscode) });
    }

    // the merge runner (one card; always there)
    var merging = (d.topics || []).filter(function (t) { return t && t.state === 'merging'; })[0];
    var waitingMerge = (d.topics || []).filter(function (t) { return t && t.state === 'waiting to merge'; }).map(function (t) { return t.name; });
    var merged = (d.topics || []).filter(function (t) { return t && t.state === 'merged'; }).map(function (t) { return t.name; });
    if (merging) m.merge = { state: 'merging', sym: '▶', word: 'Merging', line: merging.name + ' into main' };
    else if (held) m.merge = { state: 'held', sym: '▣', word: 'Held', line: 'Hold all is on: nothing new is merged' + (waitingMerge.length ? ' · waiting: ' + waitingMerge.join(', ') : '') };
    else m.merge = { state: 'idle', sym: '○', word: 'Idle', line: (waitingMerge.length ? 'Waiting to merge: ' + waitingMerge.join(', ') : 'Nothing to merge') + (merged.length ? ' · last: ' + merged[merged.length - 1] : '') };

    m.building = m.cards.filter(function (c2) { return c2.state === 'building'; }).length;
    var counts = { building: 0, waiting: 0, owner: 0, paused: 0 };
    m.cards.forEach(function (c2) { counts[c2.state] += 1; });
    var parts = [];
    if (counts.building) parts.push(counts.building + ' building');
    if (ownerList.length) parts.push(ownerList.length + ' need the operator');
    if (counts.waiting) parts.push(counts.waiting + ' waiting for a runner');
    if (counts.paused) parts.push(counts.paused + ' paused');
    m.runSummary = m.cards.length ? parts.join(' · ') : 'No topic has open jobs';

    // the needs-the-operator strip
    var needs = ownerList;
    var onlyJobs = needs.every(function (n) { return n.kind === 'job'; });
    var firstNeed = needs.length ? (needs[0].kind === 'job' ? needs[0].number + ' ' + clean(needs[0].title) : clean(needs[0].title) + (needs[0].why ? ': ' + clean(needs[0].why) : '')) : '';
    if (!needs.length) m.strip = { count: 0, text: 'Nothing needs the operator' };
    else m.strip = { count: needs.length, text: needs.length + (onlyJobs ? (needs.length === 1 ? ' job needs' : ' jobs need') : (needs.length === 1 ? ' thing needs' : ' things need')) + ' the operator: ' + firstNeed + (needs.length > 1 ? ' and ' + (needs.length - 1) + ' more' : '') };

    // the tabs and their counts
    var groups = d.backlog && Array.isArray(d.backlog.groups) ? d.backlog.groups : [];
    var backlogCount = groups.reduce(function (s, g) { return s + (Array.isArray(g.items) ? g.items.length : 0); }, 0);
    var june = Array.isArray(d.juneBacklog) ? d.juneBacklog : [];
    var doneList = Array.isArray(d.doneList) ? d.doneList : [];
    var doneCount = Number.isInteger(d.doneTotal) ? d.doneTotal : (doneList.length || items.filter(function (i) { return FINISHED[i.state]; }).length);
    var runs = Array.isArray(d.mergeHistory) ? d.mergeHistory : [];
    m.tabs = { list: open.length, merges: runs.length, backlog: backlogCount, june: june.length };

    // chips of The list: All, then each topic in the queue's order (jobs with no topic last), a state symbol where the topic has a card
    var cardBy = {};
    m.cards.forEach(function (c2) { if (c2.topic) cardBy[c2.topic] = c2; });
    var chipTopics = order.concat(extra).filter(function (t) { return !!byTopic[t]; });
    var chipSeen = {};
    chipTopics = chipTopics.filter(function (t) { if (chipSeen[t]) return false; chipSeen[t] = true; return true; });
    if (byTopic['']) chipTopics.push('');
    m.chips = { list: [{ id: 'all', label: 'All', count: open.length, state: '' }].concat(chipTopics.map(function (t) { return { id: 'topic:' + t, label: t || 'no topic', count: byTopic[t].length, state: cardBy[t] ? cardBy[t].state : '', topic: t }; })),
      backlog: [{ id: 'all', label: 'All', count: backlogCount, state: '' }].concat(groups.map(function (g, k) { return { id: 'group:' + k, label: clean(g.heading), count: (g.items || []).length, state: '' }; })),
      merges: [], june: [] };

    // rows
    function listRow(i, st, note, extra) {
      var tp = topicOfItem(d, i);
      return Object.assign({ key: 'j' + i.number, num: String(i.number), title: clean(i.title), topic: tp || 'no topic', topicId: 'topic:' + tp, state: st, group: GROUP[st], note: note, after: Array.isArray(i.after) ? i.after.filter(function (x) { return openSet[x]; }) : [] }, extra || {});

        mk('Send', 'text', 'Sending…', function () { var t = String(ta.value || '').replace(/\s+/g, ' ').trim(); if (t) sendAnswer(q, { text: t }, 'text', 'Sending…'); });
      } else {
        if (q.command) card.append(D.h('span', 'qc', clean(q.command)));
        mk('Done', 'done', 'Sending…', function () { sendAnswer(q, { choice: 'done' }, 'done', 'Sending…'); });
      }
      card.append(btns);
      var words = ps.phase === 'confirmed' ? 'Answered. The runner carries on when it next looks.' : (ps.phase === 'sending' ? '' : ps.words);
      if (words) card.append(D.h('div', 'qm', words));
      box.append(card);
    });
  }

  // (job 4) the project's own name comes with the data (`project`), as text; with none (an older upload) the neutral words stand
  function projectTitles(d) {
    var pn = d && typeof d.project === 'string' && d.project.length > 0 && d.project.length <= 80 ? d.project : '';
    return { heading: pn || 'Build status', title: pn ? pn + ' build' : 'Build status' };
  }
  function showName() {
    var t = projectTitles(data);
    if (document.title !== t.title) document.title = t.title;
    var h = $('proj');
    if (h && h.textContent !== t.heading) h.textContent = t.heading;
  }
  function draw() {
    if (!data) return;
    showName();
    var nowMs = Date.now();
    model = buildModel(data, nowMs);
    var m = model;
    var ctl = $('ctl');
    D.setText(ctl, m.controller.sym + ' ' + m.controller.word + ' · ' + (isNaN(m.updatedAt) ? 'no time' : 'updated ' + agoWords(nowMs - m.updatedAt) + ' ago'));
    ctl.className = 'ctl ' + (m.controller.ok ? 'ok' : 'warn');
    // the answer of the controller to the command just sent (job 20): sent and waiting, confirmed, refused, not confirmed in 2 minutes
    var ps = pendingState(lastSent, data, nowMs);
    var msg = '';
    if (ps.phase === 'confirmed') lastSent = null;
    else if (ps.phase === 'refused' || ps.phase === 'timeout' || ps.phase === 'failed') {
      if (!lastSent.shownAt) { lastSent.shownAt = nowMs; setTimeout(draw, SHOW_ANSWER_MS + 100); }
      if (nowMs - lastSent.shownAt < SHOW_ANSWER_MS) msg = ps.words;
      else lastSent = null;
    }
    D.setText($('msg'), msg);
    var hs = holdState(data, inbox);
    var hb = $('hold');
    var sending = ps.phase === 'sending';
    hb.className = sending ? 'sending' : '';
    if (sending) {
      var sig = 'sending:' + ps.words;
      if (hb._sig !== sig) { hb._sig = sig; hb.textContent = ''; var bz = D.h('span', 'busy', '◔'); bz.setAttribute('aria-hidden', 'true'); hb.append(bz, D.h('span', '', ps.words)); }
    } else {
      if (hb._sig) { hb._sig = ''; hb.textContent = ''; }
      D.setText(hb, m.held ? 'Release all' : 'Hold all');
    }
    hb.setAttribute('aria-pressed', m.held ? 'true' : 'false');
    hb.disabled = sending || !hs.can;
    D.setText($('holdwhy'), hs.why);
    drawQuestions(nowMs);
    drawSettings(nowMs);
    showView();
    D.setText($('runsum'), m.runSummary);
    setTurning(m, nowMs);
    starts = markStarts(starts, m.cards);
    wasFresh = dataFresh(m, nowMs);
    D.drawCards($('cards'), m);
    var strip = $('strip');
    strip.className = m.strip.count ? 'on' : '';
    D.setText($('striptext'), m.strip.text);
    D.sync($('tabs'), TABS.map(function (t) { return D.tabSpec(t, m.tabs[t[0]], tab, pickTab); }));
    var chips = m.chips[tab] || [];
    if (!chips.some(function (c) { return c.id === chip; })) chip = 'all';
    $('chips').hidden = !chips.length;
    D.sync($('chips'), chips.map(function (c) { return D.chipSpec(c, chip, pickChip, tab === 'list' && canMove() ? chipHooks : null); }));
    // job 99: the state chips (list tab only), then the topic chip; Merged rows are cut to the first doneShown with "Show more"
    var sc = $('statechips');
    sc.hidden = tab !== 'list';
    D.sync(sc, tab === 'list' ? GROUPS.map(function (g) { return D.stateChipSpec(g, m.states[g[0]], !!groupsOn[g[0]], m.states.needs, pickGroup, showActive); }) : []);
    var rows = (m.rows[tab] || []).filter(function (r) { return (chip === 'all' || r.topicId === chip) && (tab !== 'list' || groupsOn[r.group]); });
    var total = rows.length;
    if (tab === 'list') { var mergedSeen = 0; rows = rows.filter(function (r) { if (r.state !== 'merged') return true; mergedSeen += 1; return mergedSeen <= doneShown; }); }
    // job 18: the Merge history tab has its own table (topic, branch, started, run time, result, issue)
    var mwrap = $('mergewrap');
    var onMerges = tab === 'merges';
    mwrap.hidden = !onMerges;
    $('listwrap').hidden = onMerges;
    if (onMerges) {
      if (!mwrap.children.length) {
        var mt = D.h('table'), mh = D.h('thead'), mr = D.h('tr');
        ['Topic', 'Branch', 'Started', 'Run time', 'Result', 'Issue'].forEach(function (x) { var c = D.h('th', '', x); c.setAttribute('scope', 'col'); mr.append(c); });
        mh.append(mr); mt.append(mh, D.h('tbody'));
        var me = D.h('div', 'empty');
        mwrap.append(mt, me);
      }
      var mrows = m.rows.merges;
      D.sync(mwrap.children[0].children[1], mrows.map(function (r) { return D.mergeRowSpec(r); }));
      mwrap.children[0].hidden = !mrows.length;
      D.setText(mwrap.children[1], mrows.length ? '' : 'No merges yet.');
      mwrap.children[1].hidden = !!mrows.length;
      tick();
      return;
    }
    var wrap = $('listwrap');
    if (!wrap.children.length) {
      var tb = D.h('table'), th = D.h('thead'), hr = D.h('tr');
      ['Job', 'Title', 'Topic', 'State', 'Note'].forEach(function (x) { var c = D.h('th', '', x); c.setAttribute('scope', 'col'); hr.append(c); });
      th.append(hr); tb.append(th, D.h('tbody'));
      var em = D.h('div', 'empty'); em.id = 'empty';
      var more = D.h('button', 'more', 'Show more'); more.id = 'more'; more.type = 'button';
      more.addEventListener('click', function () { doneShown += DONE_STEP; draw(); });
      wrap.append(tb, em, more);
    }
    settleMoves(nowMs);
    var can = canMove() && tab === 'list';
    rows.forEach(function (r) { r.pause = can ? r.pause : ''; var pr = mvSent['p' + r.num]; r.busy = pr && pendingState(pr, data, nowMs).phase === 'sending' ? pr.sending : ''; r.movable = r.movable && can; r.moving = !!mvSent['j' + r.num] && pendingState(mvSent['j' + r.num], data, nowMs).phase === 'sending'; });
    shownRows = tab === 'list' ? rows : [];
    var tbody = wrap.children[0].children[1];
    var before = {};
    Array.prototype.slice.call(tbody.children).forEach(function (e) { before[e.getAttribute('data-key')] = rectOf(e).top; });
    D.sync(tbody, rows.map(function (r) { return D.rowSpec(r, can ? rowHooks : null); }));
    // a row that landed somewhere else slides there (a CSS transition; none with reduced motion)
    var calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!calm) Array.prototype.slice.call(tbody.children).forEach(function (e) {
      var key = e.getAttribute('data-key');
      if (before[key] === undefined || !e.getBoundingClientRect) return;
      var dy = before[key] - rectOf(e).top;
      if (!dy) return;
      e.style.transition = 'none';
      e.style.transform = 'translateY(' + dy + 'px)';
      void e.offsetHeight;
      e.style.transition = 'transform .35s ease';
      e.style.transform = '';
    });
    wrap.children[0].hidden = !rows.length;
    D.setText(wrap.children[1], rows.length ? '' : 'Nothing here.');
    wrap.children[1].hidden = !!rows.length;
    wrap.children[2].hidden = !(tab === 'list' && total > rows.length);
    tick();
  }
  function tick() {
    if (!data || !model) return;
    var nowMs = Date.now();
    D.setText($('ctl'), model.controller.sym + ' ' + model.controller.word + ' · ' + (isNaN(model.updatedAt) ? 'no time' : 'updated ' + agoWords(nowMs - model.updatedAt) + ' ago'));
    if (dataFresh(model, nowMs) !== wasFresh) draw(); // (job 21: the cards' cranks stop when the data goes stale while the page stays open)
    D.setText($('foot'), 'Checked ' + clockOf(new Date(nowMs).toISOString()) + ' · refreshes every ' + CHECK_EVERY / 1000 + ' s');
  }
  // ---- live updates (job 11): a signal from the project's Web PubSub hub means "the data changed: fetch it now". The message is never read for its contents, and the address and its token are kept in this
  // one variable only (never written to the page, the console, localStorage or a link). Polling stays as it is; with the socket open it slows to once a minute, and any failure falls back to it.
  function makeLive(d) {
    var LIVE_GAPS = [5000, 15000, 60000, 300000]; // (growing gaps between tries; the last one then repeats)
    var LIVE_MIN_FETCH = 2000; // (at most one fetch for a signal in this time)
    var url = '', expires = 0, sock = null, isOpen = false, hidden = false, tries = 0, retryT = null, trailT = null, lastFetch = -1e12;
    function closeSock() { var s = sock; sock = null; isOpen = false; if (s) { s.onopen = s.onmessage = s.onclose = s.onerror = null; try { s.close(); } catch (e) { /* (already closed) */ } } }
    function retry() { if (retryT !== null || hidden || !url) return; var gap = LIVE_GAPS[Math.min(tries, LIVE_GAPS.length - 1)]; tries++; retryT = d.setTimer(function () { retryT = null; connect(); }, gap); }
    function lost() { closeSock(); retry(); }
    function signal() {
      var t = d.now();
      if (t - lastFetch >= LIVE_MIN_FETCH) { lastFetch = t; d.onSignal(); return; }
      if (trailT !== null) return;
      trailT = d.setTimer(function () { trailT = null; lastFetch = d.now(); d.onSignal(); }, lastFetch + LIVE_MIN_FETCH - t);
    }
    function connect() {
      if (sock || hidden || !url) return;
      if (expires && d.now() >= expires) { retry(); return; } // (the token ended: wait for a fresh address in the polled data)
      try { sock = d.open(url); } catch (e) { sock = null; retry(); return; }
      sock.onopen = function () { isOpen = true; tries = 0; };
      sock.onmessage = function (ev) { try { var m = JSON.parse(ev.data); if (m && m.type === 'message') signal(); } catch (e) { /* (not a message: ignored) */ } };
      sock.onclose = lost;
      sock.onerror = lost;
    }
    return {
      update: function (live) {
        if (!live || typeof live.url !== 'string' || !/^wss:\/\//.test(live.url)) { url = ''; expires = 0; closeSock(); return; }
        url = live.url; expires = Date.parse(live.expires) || 0;
        if (!sock && retryT === null) connect();
      },
      hide: function () { hidden = true; if (retryT !== null) { d.clearTimer(retryT); retryT = null; } if (trailT !== null) { d.clearTimer(trailT); trailT = null; } closeSock(); },
      show: function () { hidden = false; tries = 0; connect(); },
      isOpen: function () { return isOpen; },
      hasSocket: function () { return !!sock; }
    };
  }
  var live = makeLive({
    open: function (u) { return new WebSocket(u, 'json.webpubsub.azure.v1'); },
    setTimer: function (f, ms) { return setTimeout(f, ms); }, clearTimer: function (t) { clearTimeout(t); },
    now: function () { return Date.now(); },
    onSignal: function () { load(); }
  });
  function load() {
    if (document.hidden) return;
    lastFetchAt = Date.now();
    fetch(STORE + name + '.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404 && !gotGood) { $('page').hidden = true; $('lost').hidden = false; return null; }
        if (!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j) return;
        if (!j.updatedAt || !Array.isArray(j.items)) throw new Error('shape');
        gotGood = true;
        $('page').hidden = false;
        $('failed').textContent = '';
        data = j;
        if (typeof WebSocket === 'function') live.update(j.live);
        draw();
      })
      .catch(function () {
        if (!gotGood) return;
        $('failed').textContent = 'The page cannot fetch the progress just now. It is showing what it last had.';
      });
  }
  if (!/^[a-z0-9]{24,}$/.test(name)) { $('lost').hidden = false; return; }
  $('hold').addEventListener('click', function () { if (inbox) sendHold(); });
  $('cog').addEventListener('click', openSettings);
  $('back').addEventListener('click', closeSettings);
  $('acct').addEventListener('click', accountSoon);
  load();
  var pollTick = 0;
  setInterval(function () { if (live.isOpen() && ++pollTick % 6 !== 0) return; load(); }, CHECK_EVERY); // (with the socket open, a poll once a minute only)
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) live.hide(); else { live.show(); load(); tick(); } });
})();
</script>
</body>
</html>
