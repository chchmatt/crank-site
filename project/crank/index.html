<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Build status</title>
<style>
:root{--ok:#5fd39a;--ok-muted:#7fb89a;--bad:#ff6b6b;--calm:#8fb4ff;--stalled:#6cb6ff;--stalled-bg:#1d3347;--urgent:#ff4f8b;--ground:#1c1b29;--surface:#25243a;--border:#3a3957;--text:#f4efe2;--muted:#a9a5bf;--accent:#ff5a36;--amber:#f5c05a;--green:#5fd39a;--chip:#2e2d46;--warm:#33211f;--warm-track:#5a3a36;
--card-h:144px;--merge-h:108px;--gutter:16px}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button:disabled{cursor:not-allowed}
.mono{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.wrap{max-width:1160px;margin:0 auto;padding:0 var(--gutter)}
[hidden]{display:none!important}

/* header */
header{border-bottom:1px solid var(--border);padding:16px 0}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{flex:none;width:72px;height:72px;display:block}
/* job 21: the header logo is big and always still. The turning is done by the small crank on each runner card that is building (below), in CSS only. */
@keyframes crank-turn{to{transform:rotate(360deg)}}
.who{flex:1;min-width:180px}
@media (max-width:520px){.who{min-width:120px}}
.who h1{margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere;min-width:0;flex:1}
/* job 26: the toolbar on the project's name line, at the right: settings (a cog) and the account (a silhouette). 44 px targets, muted, the accent on hover or focus. */
.namerow{display:flex;align-items:center;gap:8px;min-width:0}
.tb{display:flex;flex:none;margin-left:auto}
.tb button{width:44px;height:44px;padding:0;display:grid;place-items:center;background:transparent;border:0;border-radius:10px;color:#a9a5bf}
.tb button:hover,.tb button:focus-visible{color:var(--accent)}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#acctnote{font-size:12px;color:var(--muted)}
#acctnote:empty{display:none}
/* job 38: the gripper, the pinned rows, a row that is being dragged or moved, and the toast. The gripper and the arrows draw their marks with CSS, so the cell's own text stays the job number and the note. */
.grip,.cgrip{border:0;background:transparent;color:var(--muted);padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grip{width:28px;min-height:44px;margin-right:4px;font-size:16px;line-height:1}
.grip::before{content:"\22EE\22EE"}
.cgrip[hidden]{display:none!important}
/* job 121: a row that cannot be dragged keeps an empty space the gripper's width, so every number and title start at the same place; the space holds nothing focusable */
.grip[hidden]{display:inline-block;visibility:hidden;pointer-events:none}
.grip:hover,.grip:focus-visible,.cgrip:hover{color:var(--accent)}
td.num{white-space:nowrap}
.cgrip{display:inline-block;width:18px;height:18px;margin-left:4px;font-size:12px;line-height:18px;text-align:center}
.cgrip::before{content:"\22EE\22EE"}
tr.pin-owner td{background:var(--warm)}
tr.pin-owner td.state span,tr.pin-owner td.state{font-weight:700}
tr.pin-owner td.num{box-shadow:inset 3px 0 0 var(--amber)}
tr.urg:not(.pin) td.num{box-shadow:inset 4px 0 0 var(--urgent)}
.ug{margin-left:4px;color:var(--urgent);font-weight:700}
.ug[hidden]{display:none}
.chip.urgent-chip{border-color:var(--urgent);color:var(--urgent)}
.chip.urgent-chip .lb::before{content:"\26A1\00a0"}
.chip.empty{color:var(--muted);border-color:var(--border);background:transparent}
.chip.empty .n{color:var(--muted)}
tr.pin-building td.num{box-shadow:inset 3px 0 0 var(--ok)}
tr.dragging td{opacity:.9;background:var(--warm)}
tr.dragging{position:relative;z-index:3;transition:none!important;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#listwrap tbody tr{transition:transform .15s ease}
@media (prefers-reduced-motion:reduce){#listwrap tbody tr{transition:none}}
td.note .pz{float:right}
.jmove{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jmove button{min-height:44px;min-width:44px;padding:0 14px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:14px}
.jmove button:disabled{color:var(--muted);border-style:dashed}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--accent)}
tr.moving td{opacity:.7}
.chip.dragging{opacity:.55}
.chip.drop-here{outline:2px solid var(--accent)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,520px);padding:10px 14px;background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:10px;font-size:14px;z-index:5}
#toast:empty{display:none}
.askbox{position:fixed;left:50%;top:30%;transform:translateX(-50%);max-width:min(92vw,420px);padding:16px;background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:10px;font-size:15px;z-index:6}
.askbox button{min-height:44px;min-width:44px;margin:6px 8px 0 0;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px}
/* job 39: a job's own page */
#listcount{margin:6px 0;font-size:13px;color:var(--muted);white-space:nowrap}
#listcount[hidden]{display:none}
.formbar{position:sticky;top:0;z-index:2;background:var(--ground);padding:8px 0;align-items:center}
.formbar .formstale[hidden]{display:none}
#strip.on{cursor:pointer}
#watching{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#watching[hidden]{display:none}
.wcard{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px;max-width:100%;padding:8px 36px 8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer}
.wcard .wid{font-size:12px;color:var(--muted)}
.wcard .wt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.wcard .ws{font-size:13px}
.wcard .wx{position:absolute;top:2px;right:2px;min-width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.wcard.changed{border-width:2px;border-color:var(--accent);background:var(--warm);animation:watchflash 1s ease-in-out 3}
.wcard.changed.s-built,.wcard.changed.s-merged{border-color:var(--green)}
.wcard.changed.s-owner{border-color:var(--amber)}
@keyframes watchflash{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--accent)}}
@media (prefers-reduced-motion:reduce){.wcard.changed{animation:none}}
.wbtn{min-height:44px;min-width:44px;padding:0 8px;margin-left:4px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.wbtn[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}
#stalledbar{position:sticky;top:0;z-index:7;padding:10px 16px;background:var(--stalled-bg);color:var(--text);border-bottom:3px solid var(--stalled);font-weight:600}
#stalledbar[hidden]{display:none}
.sy{display:inline-block;cursor:default;pointer-events:none}
.sy[data-ic]{width:13px;height:13px;font-size:0;line-height:0;position:relative;border:1.5px solid currentColor;border-radius:50%;box-sizing:border-box;vertical-align:-1px;margin-right:2px}
.sy[data-ic="waiting"]{background:conic-gradient(currentColor 0 25%,transparent 0)}
.sy[data-ic="built"]{background:conic-gradient(currentColor 0 50%,transparent 0)}
.sy[data-ic="cancelled"]::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;margin-left:-.75px;background:currentColor;transform:rotate(45deg)}
.nw{white-space:nowrap}
td.issue{overflow-wrap:anywhere}
.tw{overflow-wrap:anywhere}
.code{display:inline-block;margin:2px 0 0 6px;padding:0 6px;border-radius:6px;border:1px solid var(--border);font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;color:var(--text);text-decoration:none}
a.code{text-decoration:underline}
.mc0{background:hsla(210,70%,50%,.22);border-color:hsla(210,70%,45%,.7)}
.mc1{background:hsla(30,85%,50%,.22);border-color:hsla(30,85%,45%,.7)}
.mc2{background:hsla(130,55%,45%,.22);border-color:hsla(130,55%,40%,.7)}
.mc3{background:hsla(280,55%,55%,.22);border-color:hsla(280,55%,50%,.7)}
.mc4{background:hsla(340,70%,55%,.22);border-color:hsla(340,70%,50%,.7)}
.mc5{background:hsla(180,60%,40%,.22);border-color:hsla(180,60%,35%,.7)}
#jobpage,#mergepage{margin-top:12px}
#mergepage h2{margin:8px 0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
#mergeback{min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
#jobpage h2{margin:8px 0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
#jobback{min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
.jrow{padding:10px 0;border-bottom:1px solid var(--border)}
.jrow .jl2{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.jrow .jv{font-size:14px;overflow-wrap:anywhere}
.jrow a.jl{display:inline-block;margin:0 10px 4px 0;color:var(--text);text-decoration:underline;overflow-wrap:anywhere}
a.jl{color:var(--text);text-decoration:none}
a.jl:hover,a.jl:focus-visible{color:var(--accent);text-decoration:underline}
.jpick label{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.jpick input{width:22px;height:22px}
.jpick button{min-height:44px;min-width:44px;padding:0 16px;margin-top:8px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
.jpick button:disabled{color:var(--muted);border-style:dashed}
.jpick button.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);font-weight:600}
.jnote{font-size:13px;color:var(--muted)}
.srow.mergerow .mafter{display:inline-flex;flex-wrap:wrap;gap:6px 12px}.srow.mergerow .mpick{display:inline-flex;align-items:center;gap:4px;min-height:44px}.srow.mergerow [hidden]{display:none}.srow.autotestrow input[type=number]{width:90px}.srow.testrow .lasttest{margin:0}
.jsched input[type=datetime-local],.jsched select,.srow.runsrow input,.srow.runsrow select,.srow.basesrow input:not([type=checkbox]),.srow.basesrow select,.srow.squashrow select,.srow.mergerow input:not([type=checkbox]),.srow.mergerow select,.srow.autotestrow input:not([type=checkbox]){min-height:44px;font-size:14px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:10px;padding:0 10px;color-scheme:dark}
.jsched .quick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.jsched .quick button,.jsched>button{min-height:44px;min-width:44px;padding:0 14px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
.jsched button:disabled{color:var(--muted);border-style:dashed}
.jsched button.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);font-weight:600}
.clock{margin-right:4px}
tbody tr{cursor:pointer}
/* the project settings view (job 27): the project's name, the most runners (− and +) and the job prefix (a field and Save) */
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border)}
.srow .sl{flex:none;min-width:96px;font-size:13px;font-weight:600}
.srow .sv{font-size:14px;overflow-wrap:anywhere}
.srow .sn{min-width:32px;text-align:center;font-size:18px;font-weight:600}
.srow button{min-height:44px;min-width:44px;padding:0 14px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:16px}
.srow button:disabled{color:var(--muted);border-style:dashed}
.srow button.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);font-weight:600;font-size:14px}
.reach{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.reach .rn{font-weight:600;white-space:nowrap}
.reach .rs{flex:1 1 160px;overflow-wrap:anywhere}
.reach .rc{color:var(--muted);font-size:13px}
.reach button,.mrow button{min-height:44px;min-width:44px;padding:0 14px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:15px}
.reach button:disabled,.mrow button:disabled{color:var(--muted);border-style:dashed}
#modehead{font-size:16px;margin:18px 0 4px}
.mrow{padding:10px 0;border-bottom:1px solid var(--border)}
.mrow .mt{font-size:13px;font-weight:600;margin-bottom:6px}
.mrow .mb{display:flex;gap:8px;flex-wrap:wrap}
.mrow button[aria-pressed="true"]{background:var(--warm);border-color:var(--accent);font-weight:600}
.mrow .md{font-size:13px;color:var(--muted);margin-top:6px}
.mrow .mm{font-size:13px;margin-top:4px}
.topicrow input{width:min(46vw,260px);letter-spacing:0;text-transform:none;font-size:14px}
.srow input{box-sizing:border-box;width:84px;min-height:44px;padding:0 10px;font:inherit;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:10px}
.sm{flex-basis:100%;font-size:13px;color:var(--amber)}
.sm:empty{display:none}
.sh{flex-basis:100%;font-size:13px;color:var(--muted)}
.sh:empty{display:none}
#settings{margin-top:12px}
#settings h2{margin:8px 0;font-size:17px;font-weight:600}
#back{min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
.ctl{font-size:13px;color:var(--muted)}
.ctl .dot{display:inline-block;width:1.1em}
.ctl.ok .dot{color:var(--green)}
.ctl.warn .dot{color:var(--bad)}
#msg{min-height:18px;font-size:13px;color:var(--amber)}
#hold{flex:none;min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
#hold[aria-pressed="true"]{background:var(--warm);border-color:var(--accent)}
#hold:disabled{color:var(--muted);border-style:dashed}
/* job 20: a command that was sent shows it at once: a "sent" look (colour AND words), a small turning mark, and the button cannot be pressed again until the controller answers */
#hold.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);border-style:solid;font-weight:600}
#hold .busy,.question .busy,.srow .busy,.jpick .busy{display:inline-block;margin-right:6px;animation:crank-turn 1s linear infinite}
@media (prefers-reduced-motion:reduce){#hold .busy,.question .busy,.srow .busy,.jpick .busy{animation:none}}
/* job 59: a question a runner asked the operator: a box at the top with the job, the line, then Approve / Reject, a text box and Send, or the command and Done */
#questions{margin-top:12px}
.question{border:1px solid var(--amber);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--surface)}
.question .qh{font-size:13px;font-weight:600;color:var(--amber)}
.question .ql{margin-top:4px;font-size:14px;overflow-wrap:anywhere}
.question .qc{display:block;margin-top:6px;padding:6px 8px;font-family:monospace;font-size:13px;background:var(--warm);border-radius:6px;overflow-wrap:anywhere;user-select:all}
.question textarea{box-sizing:border-box;width:100%;min-height:44px;margin-top:8px;padding:8px;font:inherit;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px}
.question .qb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.question button{min-height:44px;min-width:44px;padding:0 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:14px}
.question button:disabled{color:var(--muted);border-style:dashed}
.question button.sending:disabled{color:var(--text);background:var(--warm);border:1px solid var(--accent);font-weight:600}
.question .qm{margin-top:6px;font-size:13px;color:var(--amber)}
#holdwhy{font-size:12px;color:var(--muted)}
#holdwhy:empty{display:none}

/* runners */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 0 8px}
.sec h2{margin:0;font-size:15px;font-weight:600}
.sec span{font-size:13px;color:var(--muted)}
/* job 90: Hold all sits on the Runners heading line, at the right (the title bar keeps its space for the cog and the account) */
.sec #runsum{flex:1;min-width:0}
.sec #hold{margin-left:auto;align-self:center}
#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* ONE size for every card, whatever its state: no state class below changes height, padding or width, so nothing jumps */
.card{position:relative;height:var(--card-h);padding:12px;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.card .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .jb{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.3;min-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .tt{font-size:13px;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track{margin-top:auto;height:6px;flex:none}
.bar{height:6px;width:0}
.card.building{border-color:var(--ok)}
.card.building .st{color:var(--ok)}
.card.building .track{border-radius:3px;background:var(--border)}
.card.building .bar{border-radius:3px;background:var(--ok)}
.card.owner{border-color:var(--amber)}
.card.owner .st{color:var(--amber)}
.card.waiting{background:transparent;border:1px dashed var(--muted)}
.card.waiting .st{color:var(--muted)}
.card.paused{background:transparent}
.card.paused .st{color:var(--muted)}
.card.paused .nm,.card.paused .tt{color:var(--muted)}
.card.merge{grid-column:1/-1;height:var(--merge-h);background:transparent;border:1px dashed var(--border)}
.card.merge .st{font-weight:500;color:var(--muted)}
.card.merge .tt{min-height:0;margin-top:4px;-webkit-line-clamp:2;color:var(--muted)}
.card.merge.merging{background:var(--warm);border:1px solid var(--ok)}
.card.merge.merging .st{color:var(--ok);font-weight:600}
.card.merge.merging .tt{color:var(--text)}
.card.merge.merging .track{border-radius:3px;background:var(--warm-track)}
/* job 21: the small crank on a card: the approved icon's tile, ring and arm (the arm is its own layer, so it turns about the ring's centre). It turns steadily while the card is building (the page puts .turn on it only while the data is under 2 minutes old), after a crank start (.start: one or two slow heavy turns with a shake, about 1.5 s, then the steady turn goes on without a jump). CSS animations only. */
.card .nm{padding-right:34px}
.card .cm{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:7px;background:#1c1b29;pointer-events:none}
.card .cm .ring,.card .cm .arm{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:50% 50%}
.card .cm .ring{left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border:1.8px solid #f4efe2;border-right-color:transparent;border-radius:50%;box-sizing:border-box}
.card .cm .ring::after{content:"";position:absolute;left:50%;top:50%;width:3.5px;height:3.5px;margin:-1.75px 0 0 -1.75px;border-radius:50%;background:#ff5a36}
.card .cm .arm::before{content:"";position:absolute;left:50%;top:50%;width:7.3px;height:1.5px;margin-top:-.75px;border-radius:1px;background:#ff5a36}
.card .cm .arm::after{content:"";position:absolute;left:calc(50% + 5.15px);top:calc(50% - 2.15px);width:4.3px;height:4.3px;border-radius:50%;background:radial-gradient(#1c1b29 0 .8px,#ff5a36 .9px)}
.card.turn .cm .arm{animation:crank-turn 4s linear infinite}
.card.turn.start .cm{animation:crank-shake 1.5s linear 1}
.card.turn.start .cm .arm{animation:crank-start 1.5s linear 1,crank-turn 4s linear 1.5s infinite}
@keyframes crank-start{0%{transform:rotate(0)}22%{transform:rotate(70deg);animation-timing-function:ease-out}30%{transform:rotate(40deg);animation-timing-function:ease-in}62%{transform:rotate(400deg)}100%{transform:rotate(720deg)}}

  function keyIcon() {
    var i = D.h('span', 'keyic');
    i.setAttribute('aria-hidden', 'true');
    i.append(D.h('i', 'ka'), D.h('i', 'kb'), D.h('i', 'kc'));
    return i;
  }
  function signedMember() { return API_ON && signin.available() && signin.signedIn() && !!myRole; }
  function isOwner() { return signedMember() && myRole === 'owner'; }
  function permWords(list) { return (Array.isArray(list) ? list : []).map(function (p) { var k = KEY_PERMS.filter(function (x) { return x[0] === p; })[0]; return k ? k[1] : p === 'claim' ? 'Pick and claim jobs' : p === 'controller' ? 'Run this project' : p; }).join(', '); }
  function whenWords(at) { return at ? clockOf(at) : 'never'; }
  function keysCall(method, suffix, body) { return meCall(method, '/v1/projects/' + API_PROJECT + '/keys' + (suffix || ''), body); }
  function keysLoad() {
    if (!signedMember()) { keyRows = null; drawKeys(); return Promise.resolve(); }
    return keysCall('GET', '').then(function (r) {
      if (r.ok && Array.isArray(r.json.keys)) { keyRows = r.json.keys; keysNote = ''; } else keysNote = apiProblem(r.status);
      drawKeys();
    });
  }
  /** Makes a key. The key comes back once: it is put in the box and nowhere else. */
  function keysMake(body) {
    if (keysBusy) return;
    keysBusy = true; keysNote = ''; drawKeys();
    keysCall('POST', '', body).then(function (r) {
      keysBusy = false;
      if (r.ok && r.json && typeof r.json.key === 'string') {
        shownKey = { key: r.json.key, name: String(r.json.name || ''), kind: String(r.json.kind || body.kind), copied: false };
        return keysLoad();
      }
      keysNote = r.status === 409 ? 'A key with that name is there already. Choose another name.' : (r.json && r.json.error && r.status !== 401 && r.status !== 403 ? String(r.json.error) : apiProblem(r.status));
      drawKeys();
    });
  }
  function keysRevoke(row) {
    confirmRevoke = ''; keysNote = '';
    keysCall('DELETE', '/' + encodeURIComponent(row.id)).then(function (r) {
      if (!r.ok) keysNote = r.status === 403 ? 'Only the project owner can revoke that key.' : apiProblem(r.status);
      return keysLoad();
    });
  }
  /** The box that shows a new key once, with a copy button and one line. Closing it forgets the key. */
  function keyBox(kind) {
    var b = D.h('div', 'keybox');
    var head = D.h('div', 'keyhead');
    head.append(keyIcon(), D.h('b', '', shownKey.name || 'New key'));
    var code = D.h('code', 'keycode', shownKey.key);
    var copy = D.h('button', 'keycopy', shownKey.copied ? 'Copied' : 'Copy');
    copy.addEventListener('click', function () {
      try { if (typeof navigator === 'object' && navigator.clipboard) navigator.clipboard.writeText(shownKey.key); } catch (e) { /* (the key can still be read and copied by hand) */ }
      shownKey.copied = true; keysSig = ''; drawKeys();
    });
    var close = D.h('button', 'keyclose', 'Close');
    close.addEventListener('click', function () { shownKey = null; keysSig = ''; drawKeys(); });
    b.append(head, code, D.h('div', 'keyline', kind === 'controller' ? "Paste this into the Crank desktop app on the PC that will run this project. It won't be shown again." : kind === 'personal' ? "Paste this into the Crank API key file on the PC where VS Code runs. It won't be shown again." : "Copy this key now. It won't be shown again."), copy, close);
    return b;
  }
  function keyRow(row, mine) {
    var r = D.h('div', 'srow keyrow' + (row.revokedAt ? ' revoked' : ''));
    r.append(keyIcon(), D.h('span', 'sl', row.name));
    var words = (row.kind === 'personal' && !mine ? 'VS Code key · ' : '') + permWords(row.permissions) + ' · made ' + whenWords(row.made) + ' · last used ' + whenWords(row.lastUsed) + (row.revokedAt ? ' · Revoked' : '');
    r.append(D.h('span', 'sv', words));
    if (!row.revokedAt) {
      if (confirmRevoke === row.id) {
        var yes = D.h('button', '', 'Yes, revoke'), no = D.h('button', '', 'No');
        yes.addEventListener('click', function () { keysRevoke(row); });
        no.addEventListener('click', function () { confirmRevoke = ''; keysSig = ''; drawKeys(); });
        r.append(D.h('span', 'sure', 'Revoke this key?'), yes, no);
      } else {
        var rv = D.h('button', '', 'Revoke');
        rv.addEventListener('click', function () { confirmRevoke = row.id; keysSig = ''; drawKeys(); });
        r.append(rv);
      }
    }
    return r;
  }
  function drawKeys() {
    var ctl = $('ctlkeys'), api = $('apikeys'), mine = $('mykeys');
    if (!ctl || !api || !mine) return;
    var sig = JSON.stringify([keyRows, shownKey && [shownKey.name, shownKey.kind, shownKey.copied], keysNote, confirmRevoke, keysBusy, myRole, signedMember()]);
    if (sig === keysSig) return;
    keysSig = sig;
    ctl.textContent = ''; api.textContent = ''; mine.textContent = '';
    mine.hidden = !signedMember();
    if (!signedMember()) return;
    var rows = Array.isArray(keyRows) ? keyRows : [];
    if (isOwner()) {
      var add = D.h('button', 'keymake', 'Add a controller');
      add.disabled = keysBusy;
      add.addEventListener('click', function () { keysMake({ kind: 'controller' }); });
      ctl.append(add);
      rows.filter(function (k) { return k.kind === 'controller'; }).forEach(function (k) { ctl.append(keyRow(k, false)); });
      if (shownKey && shownKey.kind === 'controller') ctl.append(keyBox('controller'));
      api.append(D.h('h3', '', 'API keys'));
      var name = D.h('input', 'keyname'); name.setAttribute('placeholder', 'Name, such as Claude'); name.setAttribute('aria-label', 'Key name'); name.setAttribute('maxlength', '40');
      var ticks = {};
      var form = D.h('div', 'keyform');
      form.append(name);
      KEY_PERMS.forEach(function (p) { var lab = D.h('label', 'keytick'); var cb = D.h('input'); cb.setAttribute('type', 'checkbox'); cb.checked = true; ticks[p[0]] = cb; lab.append(cb, D.h('span', '', p[1])); form.append(lab); });
      var make = D.h('button', 'keymake', 'Make a key');
      make.disabled = keysBusy;
      make.addEventListener('click', function () {
        var perms = KEY_PERMS.map(function (p) { return p[0]; }).filter(function (p) { return ticks[p].checked; });
        if (!String(name.value || '').trim()) { keysNote = 'Give the key a name first.'; keysSig = ''; drawKeys(); return; }
        if (!perms.length) { keysNote = 'Tick what the key may do.'; keysSig = ''; drawKeys(); return; }
        keysMake({ kind: 'tool', name: String(name.value).trim(), permissions: perms });
      });
      form.append(make);
      api.append(form);
      rows.filter(function (k) { return k.kind === 'tool'; }).forEach(function (k) { api.append(keyRow(k, false)); });
      if (shownKey && shownKey.kind === 'tool') api.append(keyBox('tool'));
    }
    mine.append(D.h('h3', '', 'My keys'));
    var who = D.h('input', 'keyname'); who.setAttribute('placeholder', 'Your name, so the project owner knows whose key it is'); who.setAttribute('aria-label', 'Your name'); who.setAttribute('maxlength', '40');
    var mk = D.h('button', 'keymake', 'Make my VS Code key');
    mk.disabled = keysBusy;
    mk.addEventListener('click', function () {
      var nm = String(who.value || '').trim();
      if (!nm) { keysNote = 'Type your name first.'; keysSig = ''; drawKeys(); return; }
      keysMake({ kind: 'personal', name: nm });
    });
    var mform = D.h('div', 'keyform');
    mform.append(who, mk);
    mine.append(mform);
    rows.filter(function (k) { return k.kind === 'personal'; }).forEach(function (k) { mine.append(keyRow(k, !isOwner())); });
    if (shownKey && shownKey.kind === 'personal') mine.append(keyBox('personal'));
    (isOwner() ? api : mine).append(D.h('div', 'cnote', keysNote));
  }
  function accept(j) {
    if (!j.updatedAt || !Array.isArray(j.items)) throw new Error('shape');
    gotGood = true;
    $('page').hidden = false;
    $('failed').textContent = '';
    data = j;
    if (!API_ON && typeof WebSocket === 'function') live.update(j.live);
    draw();
  }
  function apiLoad() {
    var now = Date.now();
    if (linkDead || now < apiWaitUntil || !tokenReady) return;
    lastFetchAt = now;
    apiCall('GET', '/status')
      .then(function (r) {
        if (r.status === 404 && !gotGood) { $('page').hidden = true; $('lost').hidden = false; return null; }
        if (!r.ok) { apiFail(r.status, r); return null; }
        return r.json();
      })
      .then(function (j) { if (!j) return; accept(j); apiFails = 0; apiWaitUntil = 0; apiMore(); })
      .catch(function () { apiFail(0, null); });
  }
  function load() {
    if (document.hidden) return;
    if (API_ON) { apiLoad(); return; }
    lastFetchAt = Date.now();
    fetch(STORE + name + '.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404 && !gotGood) { $('page').hidden = true; $('lost').hidden = false; return null; }
        if (!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j) return;
        accept(j);
      })
      .catch(function () {
        if (!gotGood) return;
        $('failed').textContent = 'The page cannot fetch the progress just now. It is showing what it last had.';
      });
  }
  if (TOKEN_MODE) {
    if (!API_ON || !signin.available()) { $('lost').hidden = false; return; }
  } else if (!(API_ON ? /^[A-Za-z0-9_-]{20,}$/ : /^[a-z0-9]{24,}$/).test(name)) { $('lost').hidden = false; return; }
  $('hold').addEventListener('click', function () { if (inbox) sendHold(); });
  $('cog').addEventListener('click', openSettings);
  $('jobback').addEventListener('click', backFromJob);
  $('mergeback').addEventListener('click', closeMerge);
  // job 165: pressing the banner turns the Active chip on and scrolls to the first Needs operator row (every counted job, runner or topic can be reached from there)
  function goToNeeds() {
    if (!model || !model.strip.count) return;
    if (tab !== 'list') pickTab('list');
    showActive();
    var first = shownRows.filter(function (r) { return r.state === 'owner'; })[0];
    var el = first ? rowEls()['j' + first.num] : null;
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
  }
  $('strip').setAttribute('tabindex', '0');
  $('strip').addEventListener('click', goToNeeds);
  $('strip').addEventListener('keydown', function (ev) { if (ev && (ev.key === 'Enter' || ev.key === ' ')) { if (ev.preventDefault) ev.preventDefault(); goToNeeds(); } });
  if (typeof addEventListener === 'function') addEventListener('popstate', onPop);
  $('back').addEventListener('click', closeSettings);
  $('acct').addEventListener('click', accountSoon);
  $('claimgo').addEventListener('click', claimIt);
  $('signinbtn').addEventListener('click', function () { signin.signIn(); });
  if (TOKEN_MODE) {
    signin.init().then(function (ok) {
      if (!ok) { $('signinbox').hidden = false; return null; }
      return findRole().then(function (r) {
        if (r.status === 401) { $('signintext').textContent = apiProblem(401); $('signinbox').hidden = false; return; }
        if (!r.role) { $('lost').textContent = r.status === 200 ? 'This project is not one of yours.' : apiProblem(r.status); $('lost').hidden = false; return; }
        applyRole(r.role); tokenReady = true; load();
      });
    }, function () { $('signintext').textContent = "Sign-in didn't finish. Try again."; $('signinbox').hidden = false; });
  } else {
    load();
    if (API_ON && signin.available()) signin.init().then(function (ok) { if (ok) offerClaim(); }, function () { /* (the secret link works without it) */ });
  }
  var pollTick = 0;
  setInterval(function () { if (live.isOpen() && ++pollTick % 6 !== 0) return; load(); }, CHECK_EVERY); // (with the socket open, a poll once a minute only)
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) live.hide(); else { live.show(); load(); tick(); } });
})();
</script>
</body>
